# Traefik on K3s serves standard Ingress resources by default.
# Change `gelift-tracker.local` to your hostname or remove this file from kustomization.yaml if unused.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gelift-tracker
spec:
  ingressClassName: traefik
  rules:
    - host: gelift.gewis.nl
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gelift-tracker
                port:
                  number: 80
