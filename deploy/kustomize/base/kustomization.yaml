apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gelift-tracker

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml

labels:
  - pairs:
      app.kubernetes.io/name: gelift-tracker
    includeSelectors: true

images:
  - name: gelift-tracker
    newName: gelift-tracker
    newTag: latest
